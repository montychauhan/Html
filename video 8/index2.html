<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form - HTML</title>
</head>
<body>
    <form action="post">
        <div>
        <label for="name">Enter your Username</label>
        <input type="text" id="name" name="name" placeholder="Enter your name">
        </div>

         <div>
        <label for="city">Enter your city</label>
        <input type="text" id="city" city="city" placeholder="Enter your city">
        </div>

         <div>
        <label for="pincode">Enter your pincode</label>
        <input type="numeric" id="pincode" pincode="pincode" placeholder="Enter your pincode">
        </div>

         <div>
         <label for="comment">Enter your comment</label>
        <textarea id="comment" name="comment" rows="4" cols="50" >Enter your comment here...</textarea>
         </div>

    </form>
    
</body>
</html>
